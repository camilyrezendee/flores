<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flores para você</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500&display=swap" rel="stylesheet">
<style>
 
 
:root{color-scheme:dark;--bg:#0a0c1a;--ink:#f6ecf3;--soft:#a7a2c6}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:#0a0c1a radial-gradient(120% 80% at 50% 35%,#1b1e3d 0%,#0a0c1a 58%,#05060d 100%) fixed;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:clip;display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
.fig{position:relative;flex:1 1 auto;min-height:64vh;min-height:64svh;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none}
.fig:active{cursor:grabbing}
.fig canvas{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 5px rgba(255,190,225,.22))}
.ded{padding:4px max(6vw,20px) clamp(28px,6vh,60px);text-align:center}
.ded p{margin:0 auto;max-width:28ch;font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;font-style:italic;font-weight:500;font-size:clamp(22px,4.8vw,36px);line-height:1.25;text-wrap:balance;opacity:0;transform:translateY(10px);transition:opacity 2.4s ease,transform 2.4s ease}
.ded p.on{opacity:1;transform:none}
.hint{margin-top:16px;color:var(--soft);font-size:13px;opacity:.7}
@media (prefers-reduced-motion:reduce){.ded p{transition:none}}
</style>
</head>
<body>
<div class="fig" id="fig"><canvas id="cv" role="img" aria-label="Buquê de flores do campo feito de caracteres, girando devagar"></canvas></div>
<div class="ded">
  <p id="msg">Queria colher todas as flores do mundo para você, mas como não posso, no momento, eu as criei.</p>
  <div class="hint">arraste para girar o buquê</div>
</div>
<script>
{
const cv=document.getElementById('cv'),fig=document.getElementById('fig'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed=11;
const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const norm=v=>{const l=Math.hypot(v[0],v[1],v[2])||1;return [v[0]/l,v[1]/l,v[2]/l]};
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const grow=(x,dur)=>{if(x<=0)return 0;if(x>=dur)return 1;const t=x/dur;return t*t*(3-2*t)};

const RAMP='.:-=+*oO0@';
const STEM='.:;!|';
const LEAF='.-~=*';
/* [matiz, saturação, luz] de cada flor; miolo próprio */
const PAL=[[352,88,60,48],[48,96,60,24],[322,82,72,48],[266,72,72,46],[212,88,66,46],[18,92,60,46],[0,0,96,48],[292,66,68,48],[200,70,78,44],[8,85,58,30]];
const BASE=[0,-1.35,0];
const N=17;
const flowers=[];

for(let i=0;i<N;i++){
  const th=i*2.39996+rnd()*0.35;
  const ph=0.08+0.88*Math.sqrt((i+0.5)/N);
  const L=2.1+rnd()*0.45-ph*0.4;
  const d=[Math.sin(ph)*Math.cos(th),Math.cos(ph),Math.sin(ph)*Math.sin(th)];
  const pal=PAL[i%PAL.length];
  const k=[5,6,8,12,5,10,14,6][i%8];
  const R=0.25+rnd()*0.15;
  const P0=BASE,P2=[BASE[0]+d[0]*L,BASE[1]+d[1]*L,BASE[2]+d[2]*L];
  const P1=[BASE[0]+d[0]*L*0.3,BASE[1]+d[1]*L*0.58,BASE[2]+d[2]*L*0.3];
  const bez=t=>{const a=(1-t)*(1-t),b=2*(1-t)*t,c=t*t;return [a*P0[0]+b*P1[0]+c*P2[0],a*P0[1]+b*P1[1]+c*P2[1],a*P0[2]+b*P1[2]+c*P2[2]]};
  const n=norm([d[0]*1.7,d[1],d[2]*1.7]);
  const ref=Math.abs(n[1])>0.9?[1,0,0]:[0,1,0];
  const u=norm(cross(n,ref)),v=cross(n,u);

  const pts=[];
  for(let a=0;a<104;a++){
    const p=a/104*Math.PI*2,lim=Math.abs(Math.cos(k*p/2));
    for(let r=0.03;r<=1;r+=0.055){
      let type;
      if(r<0.24)type=1;else if(r<=0.3+0.7*Math.pow(lim,0.7))type=0;else continue;
      const rr=r*R,cup=r*r*R*0.5,x=Math.cos(p)*rr,y=Math.sin(p)*rr;
      pts.push([u[0]*x+v[0]*y+n[0]*cup,u[1]*x+v[1]*y+n[1]*cup,u[2]*x+v[2]*y+n[2]*cup,type,r]);
    }
  }
  const stem=[];
  for(let s=0;s<=120;s++){const t=s/120,q=bez(t);stem.push([q[0],q[1],q[2],t])}
  const leaf=[];
  if(i%2===0){
    const t0=0.35+rnd()*0.2,o=bez(t0);
    const side=norm([d[0]+(rnd()-0.5),0.6,d[2]+(rnd()-0.5)]);
    const wv=norm(cross(side,[0,1,0.0001]));
    for(let s=0;s<=1.0001;s+=0.03){
      const w=Math.sin(Math.PI*s)*0.08;
      for(let j=-1;j<=1;j+=0.25){
        const c=[o[0]+side[0]*s*0.42+wv[0]*w*j,o[1]+side[1]*s*0.42+wv[1]*w*j,o[2]+side[2]*s*0.42+wv[2]*w*j];
        leaf.push([c[0],c[1],c[2],t0]);
      }
    }
  }
  flowers.push({pal,n,pts,stem,leaf,bez,sh:110+rnd()*35,delay:i*0.07});
}

/* laço no ponto onde os caules se juntam */
const bow=[];
for(let s=0;s<Math.PI*2;s+=0.045){
  for(let w=-0.02;w<=0.02;w+=0.02){
    bow.push([0.26*Math.sin(s)+w,BASE[1]+0.34+0.1*Math.sin(2*s),0.06*Math.cos(s)]);
  }
}

let W=0,H=0,cw=7,ch=10,cols=0,rows=0,font='',zb,cb,colb,stars=[];
const D=6,T=-0.2;
let F=100,YM=-0.05;

function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  W=fig.clientWidth;H=fig.clientHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const fs=clamp(W/112,6,12);
  ch=fs*1.05;cw=fs*0.62;
  cols=Math.ceil(W/cw);rows=Math.ceil(H/ch);
  font=fs.toFixed(1)+'px ui-monospace,Menlo,Consolas,"Courier New",monospace';
  zb=new Float32Array(cols*rows);cb=new Array(cols*rows);colb=new Array(cols*rows);
  F=Math.min(H*0.88*D/3.1,W*0.95*D/4.5);
  stars=[];
  const ns=Math.round(clamp(W*H/9000,30,120));
  const sc='.·.*+.·';
  for(let i=0;i<ns;i++)stars.push({x:Math.random()*W,y:Math.random()*H,ph:Math.random()*6.28,sp:0.6+Math.random()*1.6,c:sc[(Math.random()*sc.length)|0]});
}

let A=0.7,dragging=false,lx=0,vel=reduce?0:0.32;
const t0=performance.now();let last=t0;
const q=[0,0,0];

function render(tt,ts){
  zb.fill(0);
  const ca=Math.cos(A),sa=Math.sin(A),ct=Math.cos(T),st=Math.sin(T);
  const rot=(x,y,z)=>{const X=x*ca+z*sa,Z0=-x*sa+z*ca;q[0]=X;q[1]=y*ct-Z0*st;q[2]=y*st+Z0*ct};
  const plot=(chr,col)=>{
    const zz=q[2]+D;if(zz<0.2)return;
    const s=F/zz,px=W/2+q[0]*s,py=H*0.5-(q[1]-YM)*s;
    const c=Math.floor(px/cw),r=Math.floor(py/ch);
    if(c<0||r<0||c>=cols||r>=rows)return;
    const i=r*cols+c,inv=1/zz;
    if(inv>zb[i]){zb[i]=inv;cb[i]=chr;colb[i]=col}
  };
  const near=z=>clamp(0.66-z*0.17,0.25,1);

  for(const f of flowers){
    const g=reduce?1:grow(tt-f.delay,2.2);
    const bl=reduce?1:grow(tt-f.delay-1.3,1.8);
    if(g<=0)continue;
    for(const s of f.stem){
      if(s[3]>g)break;
      rot(s[0],s[1],s[2]);const b=near(q[2]);
      plot(STEM[Math.min(4,(b*5)|0)],'hsl('+(f.sh|0)+',55%,'+((16+34*b)|0)+'%)');
    }
    if(g>0.55){
      const lg=clamp((g-0.55)/0.45,0,1);
      for(const s of f.leaf){
        if(Math.random()>lg)continue;
        rot(s[0],s[1],s[2]);const b=near(q[2]);
        plot(LEAF[Math.min(4,(b*5)|0)],'hsl('+((f.sh+10)|0)+',60%,'+((18+34*b)|0)+'%)');
      }
    }
    if(bl<=0)continue;
    const c=f.bez(g);
    rot(f.n[0],f.n[1],f.n[2]);const face=Math.abs(q[2]);
    const p=f.pal;
    for(const pt of f.pts){
      rot(c[0]+pt[0]*bl,c[1]+pt[1]*bl,c[2]+pt[2]*bl);
      const nf=near(q[2]);
      if(pt[3]===1){
        const b=(0.5+0.5*face)*nf;
        plot(b>0.7?'@':b>0.45?'0':'o','hsl(42,95%,'+((p[3]*(0.6+0.5*b))|0)+'%)');
      }else{
        const b=clamp((0.32+0.68*face)*nf*(0.82+0.28*pt[4]),0,1);
        const l=clamp(p[2]*(0.5+0.55*b)+(pt[4]<0.4?6:0),8,95);
        plot(RAMP[Math.min(9,(b*10)|0)],'hsl('+p[0]+','+p[1]+'%,'+(l|0)+'%)');
      }
    }
  }
  const bb=reduce?1:grow(tt-0.8,1.5);
  if(bb>0){
    for(let i=0;i<bow.length*bb;i++){
      const s=bow[i];rot(s[0],s[1],s[2]);const b=near(q[2]);
      plot(b>0.6?'~':'-','hsl(335,80%,'+((50+25*b)|0)+'%)');
    }
  }

  ctx.clearRect(0,0,W,H);
  ctx.font=font;ctx.textBaseline='top';
  for(const s of stars){
    const a=0.25+0.55*(0.5+0.5*Math.sin(ts*s.sp+s.ph));
    ctx.globalAlpha=reduce?0.5:a;ctx.fillStyle='#d9d4ff';ctx.fillText(s.c,s.x,s.y);
  }
  ctx.globalAlpha=1;
  let curr='';
  for(let r=0;r<rows;r++){
    const row=r*cols;
    for(let c=0;c<cols;c++){
      const i=row+c;
      if(zb[i]===0)continue;
      if(colb[i]!==curr){curr=colb[i];ctx.fillStyle=curr}
      ctx.fillText(cb[i],c*cw,r*ch);
    }
  }
}

function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(!dragging)A+=vel*dt;
  render((now-t0)/1000,now/1000);
  requestAnimationFrame(frame);
}

fig.addEventListener('pointerdown',e=>{dragging=true;lx=e.clientX;try{fig.setPointerCapture(e.pointerId)}catch(_){}});
fig.addEventListener('pointermove',e=>{if(!dragging)return;A+=(e.clientX-lx)*0.012;lx=e.clientX});
const stop=()=>{dragging=false};
fig.addEventListener('pointerup',stop);fig.addEventListener('pointercancel',stop);

const ro=new ResizeObserver(resize);ro.observe(fig);
resize();
setTimeout(()=>document.getElementById('msg').classList.add('on'),reduce?0:2600);
requestAnimationFrame(frame);
}
</script>
</body>
</html>
